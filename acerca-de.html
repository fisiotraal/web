<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #001f3f; /* Azul marino */
            color: white;
            padding: 1em 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 20px;
            padding-right: 20px;
        }
        header h1 {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-buttons a {
            background-color: white;
            color: #001f3f;
            text-decoration: none;
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 3px;
            display: inline-block;
        }
        .header-buttons a:hover {
            background-color: #f0f0f0;
        }
        main {
            padding: 20px;
            text-align: center;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #001f3f;
        }
    </style>
</head>
<body>
    <header>
        <h1>Fisiotraal</h1>
        <div class="header-buttons">
